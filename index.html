<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Undertown</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Undertown">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3ecdc">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Spectral:ital@0;1&display=swap">
<style>
  /* Layout: one screen-printed sheet filling the phone: a green frame round a window onto a slice of city and
     ground that goes down without end; the city's alarm and its plate number on the frame's head, a depth
     gauge down its right side, a two-line key printed under it. One printed look by choice: two inks on cream. */
  :root {
    --paper: #f3ecdc;
    --green: #23a24e;
    --pink: #f0b8a5;
    --over: #1c5e2b;
    --pencil: #5d5a52;
    --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --body: "Spectral", Georgia, serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { background: var(--paper); color: var(--over); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font-family: var(--body); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #base { pointer-events: none; }
  #status { font-style: normal; font-size: 13px; letter-spacing: 0.02em; margin-bottom: 3px; font-variant-numeric: oldstyle-nums; }
  #howto { transition: opacity 1s; }
  #key {
    position: fixed; left: 0; right: 0; bottom: 0; text-align: center; pointer-events: none;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    font-size: 13px; line-height: 1.35; font-style: italic; text-wrap: balance; transition: opacity 1s; color: var(--over);
  }
</style>

<canvas id="base"></canvas>
<canvas id="top" role="img" aria-label="Undertown, a game: an ant colony under a small town. Dig under the buildings to make them fall while the city fights back."></canvas>
<div id="key"><div id="status">&nbsp;</div><div id="howto">Drag to dig · Hold to make a room<br>Tap anything for options · Two fingers to scroll · Tap the town’s name to pause</div></div>

<script>
(() => {
  const css = getComputedStyle(document.documentElement), C = (v) => css.getPropertyValue(v).trim();
  const PAPER = C('--paper'), GREEN = C('--green'), PINK = C('--pink'), OVER = C('--over'), PENCIL = C('--pencil'), DISPLAY = C('--display');
  const rgbOf = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const DPR = Math.min(2, devicePixelRatio || 1), TAU = Math.PI * 2;
  const base = document.getElementById('base'), top = document.getElementById('top');
  const rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v)), pick = (a) => a[(Math.random() * a.length) | 0];
  const mul = (a) => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  // The world is measured in the plate's units: 600 across the window, the street at 0, the ground below it.
  const UW = 600, M = 7.5; // (units across; units to a metre)
  // (The settling test: a hamlet on natural ground, where whatever the ants dig out, the ground above sinks into.)
  const SETTLE = false, FIRM = 240;
  let W, H, F, IN, G, S, RU, SKY, bg, g;
  function layout() {
    W = innerWidth; H = innerHeight;
    for (const c of [base, top]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
    bg = base.getContext('2d'); g = top.getContext('2d');
    const keyH = document.getElementById('key').offsetHeight, t0 = 14 + (parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0);
    const fh = H - keyH - 26 - t0, fw = Math.min(W - 16, Math.round(fh * 0.66));
    F = { x: Math.round((W - fw) / 2), y: t0, w: fw, h: fh, t: 22, tr: 24, b: 14 };
    IN = { x: F.x + 14, y: F.y + F.t, w: F.w - 14 - F.tr, h: F.h - F.t - F.b };
    S = IN.w / UW; RU = S * DPR;
    G = Math.round(IN.y + IN.h * 0.42);
    SKY = (G - IN.y) / S;
  }

  // ---------------------------------------------------------------- a hand with a pen, and two screens
  let T = mul(1);
  const tex = (s) => { T = mul(s * 7919 + 13); };
  const tr = (a, b) => a + T() * (b - a);
  const WM = 1.35; // (the line's weight at this scale, so a screen can hold it)
  let P; // the plates being drawn on: { ink, tint, mask }
  function plates(wu, hu, ox, oy) {
    const mk = () => { const c = document.createElement('canvas'); c.width = Math.ceil(wu * RU); c.height = Math.ceil(hu * RU); const x = c.getContext('2d'); x.setTransform(RU, 0, 0, RU, -ox * RU, -oy * RU); x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = x.fillStyle = '#000'; return x; };
    return { ink: mk(), tint: mk(), mask: [], wu, hu, ox, oy };
  }
  function line(c, x1, y1, x2, y2, w = 1, over = 1) {
    w = Math.max(w, 0.62) * WM;
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, ov = over * Math.min(1, L / 18);
    const ax = x1 - ux * ov * tr(0, 1.1), ay = y1 - uy * ov * tr(0, 1.1), bx = x2 + ux * ov * tr(0.2, 1.4), by = y2 + uy * ov * tr(0.2, 1.4);
    const n = Math.max(1, Math.ceil(L / 9)), ph = tr(0, 9), amp = 0.16 + 0.1 * Math.min(1, w);
    c.lineWidth = w * tr(0.88, 1.1); c.beginPath(); c.moveTo(ax, ay);
    for (let k = 1; k <= n; k++) { const t = k / n, off = Math.sin(t * 2.6 + ph) * amp + tr(-0.06, 0.06); c.lineTo(ax + (bx - ax) * t - uy * off, ay + (by - ay) * t + ux * off); }
    c.stroke();
  }
  function poly(c, pts, w = 1, closed = true, over = 1) { const n = pts.length; for (let k = 0; k < (closed ? n : n - 1); k++) { const a = pts[k], b = pts[(k + 1) % n]; line(c, a[0], a[1], b[0], b[1], w, over); } }
  const rect = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
  const ring = (cx, cy, rx, ry = rx, n = 16) => Array.from({ length: n }, (_, i) => [cx + Math.cos((i / n) * TAU) * rx, cy + Math.sin((i / n) * TAU) * ry]);
  function path(c, pts) { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let k = 1; k < pts.length; k++) c.lineTo(pts[k][0], pts[k][1]); c.closePath(); }
  function curve(c, pts, w = 1) { c.lineWidth = Math.max(w, 0.6) * WM; c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let k = 1; k < pts.length - 1; k++) { const m = [(pts[k][0] + pts[k + 1][0]) / 2, (pts[k][1] + pts[k + 1][1]) / 2]; c.quadraticCurveTo(pts[k][0], pts[k][1], m[0], m[1]); } const l = pts[pts.length - 1]; c.lineTo(l[0], l[1]); c.stroke(); }
  function hatch(c, pts, ang, gap, w = 0.5, tone = () => 1) {
    w = Math.max(w, 0.5) * WM; gap *= 1.3;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, R = Math.hypot(x1 - x0, y1 - y0) / 2 + 2, ca = Math.cos(ang), sa = Math.sin(ang);
    c.save(); path(c, pts); c.clip(); c.lineWidth = w;
    for (let o = -R; o <= R; o += gap * tr(0.85, 1.15)) {
      let s = -R;
      while (s < R) {
        const len = tr(10, 34), e = Math.min(R, s + len);
        const px = cx + ca * s - sa * o, py = cy + sa * s + ca * o, qx = cx + ca * e - sa * o, qy = cy + sa * e + ca * o;
        if (T() < tone((px + qx) / 2, (py + qy) / 2)) { const j = tr(-0.25, 0.25); c.beginPath(); c.moveTo(px, py + j); c.lineTo(qx, qy - j); c.stroke(); }
        s = e + (T() < 0.25 ? tr(0.5, 2.5) : 0);
      }
    }
    c.restore();
  }
  function stipple(c, pts, n, r0 = 0.55, r1 = 0.95, tone = () => 1) {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    c.save(); path(c, pts); c.clip();
    for (let k = 0; k < n; k++) { const x = tr(x0, x1), y = tr(y0, y1); if (T() < tone(x, y)) { c.beginPath(); c.arc(x, y, tr(r0, r1), 0, TAU); c.fill(); } }
    c.restore();
  }
  function occlude(pts) { P.mask.push(pts); for (const c of [P.ink, P.tint]) { c.save(); c.globalCompositeOperation = 'destination-out'; path(c, pts); c.fill(); c.restore(); } }
  // (The pink is one ink: a darker tone of it on the plate prints as denser halftone.)
  const TONES = { soil: 1, deep: 1.12, paving: 1, pipe: 0.5, concrete: 0.62, brick: 1.08, stone: 1.1, rubble: 0.95, void: 1.25, facade: 0.42, cobble: 1.05, mound: 1 };
  function tint(pts, tone) { const v = Math.round(255 - 255 * 0.46 * (TONES[tone] ?? tone)); P.tint.fillStyle = `rgb(${v},${v},${v})`; path(P.tint, pts); P.tint.fill(); }
  function erase(c, fn) { c.save(); c.globalCompositeOperation = 'destination-out'; fn(c); c.restore(); }

  // Pulling a plate through the screen: the ink spreads and fills in where the drawing's dense, the mesh breaks
  // its edges, the squeegee leaves it heavier in bands; the pink's lighter tones come out as a halftone.
  function noiseField(Wd, Hd, cell, seed) {
    const r = mul(seed), gw = Math.ceil(Wd / cell) + 2, gh = Math.ceil(Hd / cell) + 2, gr = new Float32Array(gw * gh);
    for (let i = 0; i < gr.length; i++) gr[i] = r();
    return (x, y) => { const fx = x / cell, fy = y / cell, i = fx | 0, j = fy | 0, u = fx - i, v = fy - j, s = u * u * (3 - 2 * u), t = v * v * (3 - 2 * v), q = j * gw + i; return (gr[q] * (1 - s) + gr[q + 1] * s) * (1 - t) + (gr[q + gw] * (1 - s) + gr[q + gw + 1] * s) * t; };
  }
  function pull(src, col, o, seed) {
    const Wd = src.canvas.width, Hd = src.canvas.height, c = document.createElement('canvas'); c.width = Wd; c.height = Hd;
    const x = c.getContext('2d'); x.filter = `blur(${o.spread}px)`; x.drawImage(src.canvas, 0, 0); x.filter = 'none';
    const img = x.getImageData(0, 0, Wd, Hd), d = img.data, rgb = rgbOf(col);
    const fine = noiseField(Wd, Hd, 2.2, seed), mid = noiseField(Wd, Hd, 14, seed + 1), broad = noiseField(Wd, Hd, 160, seed + 2), r = mul(seed + 3);
    for (let y = 0; y < Hd; y++) {
      const streak = 1 + o.streak * Math.sin((y + seed * 7) / 23 + Math.sin(y / 170) * 3);
      for (let xx = 0; xx < Wd; xx++) {
        const p = (y * Wd + xx) * 4; let a = d[p + 3] / 255;
        if (a < 0.02) { d[p + 3] = 0; continue; }
        if (o.tone) a *= Math.min(1, (255 - d[p]) / (255 * 0.46));
        a *= streak * (1 - o.mottle + o.mottle * 2 * broad(xx, y)) * (0.86 + 0.28 * mid(xx, y));
        let th = o.thresh + (fine(xx, y) - 0.5) * o.rough;
        if (o.tone) { const u = (xx * 0.966 + y * 0.259) * TAU / 5.2, v = (-xx * 0.259 + y * 0.966) * TAU / 5.2; th = Math.min(th + 0.4, 0.06 + 0.88 * (0.5 + 0.25 * (Math.cos(u) + Math.cos(v)))) + (fine(xx, y) - 0.5) * 0.12; }
        let out = Math.min(1, Math.max(0, (a - th) / o.soft + 0.5));
        if (r() < o.drop) out *= 0.25;
        d[p] = rgb[0]; d[p + 1] = rgb[1]; d[p + 2] = rgb[2]; d[p + 3] = out * 255;
      }
    }
    x.putImageData(img, 0, 0);
    return c;
  }
  const INKP = { spread: 0.7, thresh: 0.3, soft: 0.16, rough: 0.5, streak: 0.06, mottle: 0.1, drop: 0.012 };
  const TINTP = { spread: 1.3, thresh: 0.42, soft: 0.1, rough: 0.35, streak: 0.05, mottle: 0.1, drop: 0.004, tone: true };
  const MIS = [4, 2.5]; // (how far off the green the pink was laid, device pixels)
  let SEEDN = 1;
  // The plates, printed: onto paper (a sheet), or as a cut-out (a thing that stands in front of others).
  function printed(Pl, onPaper) {
    const ink = pull(Pl.ink, GREEN, INKP, SEEDN++ * 31), tn = pull(Pl.tint, PINK, TINTP, SEEDN++ * 31);
    const c = document.createElement('canvas'); c.width = Pl.ink.canvas.width; c.height = Pl.ink.canvas.height;
    const x = c.getContext('2d');
    if (onPaper) { x.fillStyle = x.createPattern(paperTile, 'repeat'); x.fillRect(0, 0, c.width, c.height); }
    else { x.setTransform(RU, 0, 0, RU, -Pl.ox * RU, -Pl.oy * RU); x.fillStyle = x.createPattern(paperTile, 'repeat'); for (const m of Pl.mask) { path(x, m); x.fill(); } x.setTransform(1, 0, 0, 1, 0, 0); }
    x.globalCompositeOperation = onPaper ? 'multiply' : 'source-atop';
    if (!onPaper) { x.globalCompositeOperation = 'multiply'; }
    x.drawImage(tn, MIS[0], MIS[1]); x.drawImage(ink, 0, 0);
    if (!onPaper) {
      // (Outside the cut, only ink: what the plates printed beyond it, nothing of the paper.)
      x.globalCompositeOperation = 'destination-in';
      const m = document.createElement('canvas'); m.width = c.width; m.height = c.height; const mx = m.getContext('2d');
      mx.drawImage(ink, 0, 0); mx.drawImage(tn, MIS[0], MIS[1]); mx.setTransform(RU, 0, 0, RU, -Pl.ox * RU, -Pl.oy * RU); mx.fillStyle = '#000'; for (const mm of Pl.mask) { path(mx, mm); mx.fill(); }
      x.drawImage(m, 0, 0);
    }
    return c;
  }
  // The paper: cream stock with a tooth.
  let paperTile, paperData;
  function makePaper() {
    paperTile = document.createElement('canvas'); paperTile.width = paperTile.height = 256;
    const x = paperTile.getContext('2d'); x.fillStyle = PAPER; x.fillRect(0, 0, 256, 256);
    const r = mul(5);
    for (let q = 0; q < 2600; q++) { x.fillStyle = r() < 0.5 ? 'rgba(120,96,64,0.07)' : 'rgba(255,255,255,0.3)'; x.fillRect(r() * 256, r() * 256, 1 + r() * 2.5, 1 + r()); }
    paperData = x.getImageData(0, 0, 256, 256).data;
  }

  // ---------------------------------------------------------------- the vocabulary of a facade
  function window_(x, y, w, h, kind, dark) {
    const k = P.ink;
    poly(k, rect(x, y, w, h), 0.55, true, 0.4);
    if (kind === 'arch') { k.lineWidth = 0.9; k.beginPath(); k.arc(x + w / 2, y, w / 2 + 0.8, Math.PI, 0); k.stroke(); hatch(k, [[x, y], [x + w, y], ...Array.from({ length: 7 }, (_, i) => { const a = (i / 6) * Math.PI; return [x + w / 2 + Math.cos(a) * w / 2, y - Math.sin(a) * w / 2]; })], 0.9, 1.4, 0.35); }
    else line(k, x - 1.2, y - 1.3, x + w + 1.2, y - 1.3, 0.9, 0.3);
    line(k, x - 1.5, y + h + 1, x + w + 1.5, y + h + 1, 0.8, 0.3);
    line(k, x + w / 2, y, x + w / 2, y + h, 0.35, 0);
    if (dark) { hatch(k, rect(x, y, w, h), 0.95, 1.1, 0.45); hatch(k, rect(x, y, w, h), -0.6, 1.6, 0.35); }
    else hatch(k, rect(x, y, w, h), 0.9, 2.2, 0.3, (px, py) => (py - y < h * 0.45 ? 0.75 : 0.15));
  }
  function cornice(x, y, w, depth = 7) {
    const k = P.ink;
    poly(k, rect(x - 4, y - depth, w + 8, depth * 0.55), 1.1);
    poly(k, rect(x - 2, y - depth * 0.45, w + 4, depth * 0.45), 0.8);
    for (let q = x; q < x + w; q += 4) line(k, q, y - depth * 0.42, q, y - depth * 0.12, 0.5, 0);
    hatch(k, rect(x - 2, y, w + 4, 3.2), 0, 0.9, 0.4);
  }
  // ---------------------------------------------------------------- buildings, each drawn standing on its own street (y = 0)
  function masonry(b) {
    const k = P.ink, tp = -b.body, sil = rect(0, tp, b.w, b.body);
    occlude(sil); tint(sil, 'facade');
    hatch(k, sil, 0, 2.6, 0.25, (x) => 0.12 + 0.35 * (x / b.w) ** 2);
    const sf = b.fh * 1.35, sy = -sf;
    line(k, 0, sy, b.w, sy, 1.1);
    for (let q = 4; q < b.w - 10; q += 18) { poly(k, rect(q, sy + 6, 13, sf - 9), 0.6); hatch(k, rect(q, sy + 6, 13, sf - 9), 0.9, 1.6, 0.3, (x, y) => (y < sy + 14 ? 0.8 : 0.25)); }
    hatch(k, [[-3, sy + 1], [b.w + 3, sy + 1], [b.w + 1, sy + 6], [-1, sy + 6]], 0.9, 1.1, 0.45);
    const cols = Math.max(2, Math.floor((b.w - 6) / 17)), cw = (b.w - 6) / cols;
    for (let f = 0; f < b.floors; f++) {
      const y = sy - (f + 1) * b.fh + b.fh * 0.3;
      for (let c = 0; c < cols; c++) window_(3 + c * cw + cw * 0.22, y, cw * 0.56, b.fh * 0.56, b.arch && f === b.floors - 1 ? 'arch' : 'square', T() < 0.24);
      if (f % 3 === 2) line(k, 0, sy - (f + 1) * b.fh + 1.5, b.w, sy - (f + 1) * b.fh + 1.5, 0.6, 0.6);
    }
    if (b.stone) for (let y = sy + 6; y < -2; y += 5) line(k, 0, y, b.w, y, 0.4, 0.2);

    roof(b, tp);
  }
  function chimney(x, y, h) { const k = P.ink, pts = rect(x, y - h, 7, h); occlude(pts); tint(pts, 'brick'); poly(k, pts, 0.9); poly(k, rect(x - 1.5, y - h - 2.5, 10, 2.5), 0.8); hatch(k, pts, 1.57, 1, 0.4, (px) => (px > x + 4 ? 0.9 : 0.1)); }
  function roof(b, tp) {
    const k = P.ink;
    if (b.roof === 'gable') {
      const rh = b.w * 0.3, pts = [[-5, tp], [b.w / 2, tp - rh], [b.w + 5, tp]];
      chimney(b.w * 0.68, tp - rh * 0.36, 16);
      occlude(pts); tint(pts, 'brick');
      // (Tiles: courses across, and the shade on the side away from the light.)
      for (let y = tp - 4; y > tp - rh + 4; y -= 4) { const hw = ((y - (tp - rh)) / rh) * (b.w / 2 + 5); line(k, b.w / 2 - hw + 1, y, b.w / 2 + hw - 1, y, 0.35, 0); }
      hatch(k, [[b.w / 2, tp - rh], [b.w + 5, tp], [b.w / 2, tp]], 1.1, 1.3, 0.4);
      poly(k, pts, 1.3, true, 1);
      line(k, -6, tp, b.w + 6, tp, 1.2, 0.5);
    } else if (b.roof === 'mansard') {
      const pts = [[-3, tp], [8, tp - 22], [b.w - 8, tp - 22], [b.w + 3, tp]];
      chimney(14, tp - 22, 10); chimney(b.w - 22, tp - 22, 12);
      occlude(pts); tint(pts, 'brick');
      hatch(k, pts, 1.57, 1.4, 0.35, (x) => (x > b.w * 0.6 ? 0.85 : 0.35));
      for (let x = 14; x < b.w - 18; x += 22) { const d = [[x, tp - 2], [x, tp - 13], [x + 5, tp - 18], [x + 10, tp - 13], [x + 10, tp - 2]]; occlude(d); tint(d, 'facade'); poly(k, d, 0.7); poly(k, rect(x + 2.5, tp - 11, 5, 8), 0.45); }
      poly(k, pts, 1.3, true, 1);
      cornice(0, tp + 1, b.w, 6);
    } else {
      chimney(b.w * 0.2, tp - 6, 12); chimney(b.w * 0.75, tp - 6, 9);
      cornice(0, tp + 1, b.w, 7);
    }
  }
  // A civic hall of the town's own: columns and a pediment, and a dome or a clock above.
  function civic(b) {
    const k = P.ink, bh = b.body, tp = -bh, sil = rect(0, tp, b.w, bh);
    occlude(sil); tint(sil, 'facade');
    const cx = b.w / 2;

  // Guards: soldiers holding a tunnel with their heads. Ants go by; smoke, concrete and the other colony don't.
