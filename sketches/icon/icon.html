<!doctype html><html><body style="margin:0"><canvas id="c" width="1024" height="1024"></canvas><script>
// The Undertown icon: one ant in its tunnel, printed in the game's two inks on cream, a hair out of register.
const c = document.getElementById('c'), g = c.getContext('2d'), W = 1024;
const PAPER = '#f3ecdc', GREEN = '#23a24e', PINK = '#f0b8a5', OVER = '#1c5e2b';
let seed = 11; const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const pink = document.createElement('canvas'); pink.width = pink.height = W; const p = pink.getContext('2d');
const ink = document.createElement('canvas'); ink.width = ink.height = W; const k = ink.getContext('2d');
// (The tunnel: one sweep across the ground, the ant walking it.)
const tunnel = (ctx) => { ctx.beginPath(); ctx.moveTo(40, 760); ctx.bezierCurveTo(300, 820, 360, 420, 560, 430); ctx.bezierCurveTo(760, 440, 800, 230, 1000, 200); };
// ---- pink plate: the ground, with the tunnel left as paper
p.fillStyle = PINK; p.fillRect(70, 70, W - 140, W - 140);
p.globalCompositeOperation = 'destination-out'; p.lineCap = 'round'; p.lineWidth = 250; tunnel(p); p.stroke(); p.globalCompositeOperation = 'source-over';
// ---- green plate
k.strokeStyle = OVER; k.fillStyle = OVER; k.lineCap = 'round'; k.lineJoin = 'round';
k.save(); k.beginPath(); k.rect(70, 70, W - 140, W - 140); k.clip(); // (everything printed inside the frame)
// stipple in the earth, sparse and bold
const pd = p.getImageData(0, 0, W, W).data;
for (let q = 0; q < 520; q++) { const x = 90 + R() * (W - 180), y = 90 + R() * (W - 180); if (pd[(Math.round(y) * W + Math.round(x)) * 4 + 3] < 250) continue; k.beginPath(); k.arc(x, y, 5 + R() * 4, 0, Math.PI * 2); k.fill(); }
// a stratum line or two
k.lineWidth = 7; for (const [y0, sk] of [[250, 0.15], [880, -0.1]]) { k.beginPath(); for (let x = 90; x < W - 90; x += 18) { const y = y0 + Math.sin(x / 70) * 9 + (x - 512) * sk; if (pd[(Math.round(y) * W + x) * 4 + 3] > 250) k.lineTo(x, y); else k.moveTo(x, y); } k.stroke(); }
// tunnel edges, a fine line
k.lineWidth = 6; k.save(); k.globalCompositeOperation = 'source-over'; const e = document.createElement('canvas'); e.width = e.height = W; const ex = e.getContext('2d'); ex.lineCap = 'round'; ex.lineWidth = 262; tunnel(ex); ex.stroke(); ex.globalCompositeOperation = 'destination-out'; ex.lineWidth = 250; tunnel(ex); ex.stroke(); k.drawImage(e, 0, 0); k.restore();
// the ant: big, walking up the tunnel, drawn as the game draws one — three bodies, six legs, feelers
function ant(x, y, a, s) {
  k.save(); k.translate(x, y); k.rotate(a); k.scale(s, s);
  k.lineWidth = 3.2;
  for (const sd of [-1, 1]) {
    k.beginPath(); k.moveTo(-6, 0); k.lineTo(-22, sd * 14); k.lineTo(-34, sd * 30); // hind
    k.moveTo(2, 0); k.lineTo(2, sd * 18); k.lineTo(-6, sd * 34); // middle
    k.moveTo(10, 0); k.lineTo(22, sd * 14); k.lineTo(30, sd * 30); // fore
    k.moveTo(40, sd * -3); k.quadraticCurveTo(54, sd * 6, 62, sd * 22); // feeler
    k.stroke();
  }
  k.beginPath(); k.ellipse(-26, 0, 24, 15, 0, 0, Math.PI * 2); k.fill();
  k.beginPath(); k.ellipse(4, 0, 12, 8, 0, 0, Math.PI * 2); k.fill();
  k.beginPath(); k.ellipse(28, 0, 12, 11, 0, 0, Math.PI * 2); k.fill();
  // (A highlight scratched out of the abdomen, as an engraver would.)
  k.globalCompositeOperation = 'destination-out'; k.lineWidth = 2.4; for (let q = 0; q < 4; q++) { k.beginPath(); k.arc(-28, -2, 8 + q * 3.5, Math.PI * 1.1, Math.PI * 1.55); k.stroke(); } k.globalCompositeOperation = 'source-over';
  k.restore();
}
ant(512, 476, -0.16, 6.6);
k.restore();
// The frame.
k.lineWidth = 30; k.strokeStyle = GREEN; k.strokeRect(55, 55, W - 110, W - 110);
// ---- the pull: paper, pink, green offset; grain
g.fillStyle = PAPER; g.fillRect(0, 0, W, W);
g.globalCompositeOperation = 'multiply'; g.drawImage(pink, 0, 0); g.drawImage(ink, 6, -4); g.globalCompositeOperation = 'source-over';
const id = g.getImageData(0, 0, W, W), d = id.data; for (let i = 0; i < d.length; i += 4) { const n = (R() - 0.5) * 18; d[i] += n; d[i + 1] += n; d[i + 2] += n; } g.putImageData(id, 0, 0);
window.done = c.toDataURL('image/png');
</script></body></html>
